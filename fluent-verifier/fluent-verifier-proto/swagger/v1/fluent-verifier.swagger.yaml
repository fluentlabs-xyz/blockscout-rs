swagger: "2.0"
info:
  title: v1/fluent-verifier.proto
  version: version not set
tags:
  - name: WasmVerifier
  - name: Health
consumes:
  - application/json
produces:
  - application/json
paths:
  /api/v1/fluent/supported-versions:
    get:
      summary: Lists supported compiler and SDK versions
      operationId: WasmVerifier_ListSupportedVersions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListSupportedVersionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - WasmVerifier
  /api/v1/fluent/verify-wasm:
    post:
      summary: Verifies a WASM contract using fluent-compiler CLI
      operationId: WasmVerifier_VerifyWasm
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1VerifyWasmResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1VerifyWasmRequest'
      tags:
        - WasmVerifier
  /health:
    get:
      summary: |-
        If the requested service is unknown, the call will fail with status
        NOT_FOUND.
      operationId: Health_Check
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1HealthCheckResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: service
          in: query
          required: false
          type: string
      tags:
        - Health
definitions:
  HealthCheckResponseServingStatus:
    type: string
    enum:
      - UNKNOWN
      - SERVING
      - NOT_SERVING
      - SERVICE_UNKNOWN
    default: UNKNOWN
    description: ' - SERVICE_UNKNOWN: Used only by the Watch method.'
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1ArchiveSource:
    type: object
    properties:
      content:
        type: string
        format: byte
        title: Archive content as bytes
      project_path:
        type: string
        title: |-
          Path to project directory within archive (e.g., "." or "contracts/my-contract")
          If empty, assumes project is at archive root
    title: Archive source (tar.gz or zip)
  v1CompileSettings:
    type: object
    properties:
      rustc_version:
        type: string
        title: |-
          Rust compiler version (required)
          e.g., "1.75.0" or "rustc 1.75.0 (82e1608df 2023-12-21)"
          The service will parse and match the version
      sdk_version:
        type: string
        title: |-
          Fluentbase SDK version (required)
          Must be a semantic version, e.g., "0.5.0"
      profile:
        type: string
        title: |-
          Build profile: "release", "debug", or custom
          If empty, defaults to "release"
      features:
        type: array
        items:
          type: string
        title: |-
          Cargo features to enable
          Empty list means no additional features
      no_default_features:
        type: boolean
        title: Disable default features
    title: Compilation settings (all fields required)
  v1GitSource:
    type: object
    properties:
      repository_url:
        type: string
        title: |-
          Public repository URL (must be HTTPS)
          e.g., "https://github.com/user/project.git"
      commit_ref:
        type: string
        title: |-
          Commit hash, tag, or branch to checkout
          e.g., "main", "v1.0.0", "abc123def456"
      project_path:
        type: string
        title: |-
          Path to project directory within repository
          If empty, assumes project is at repository root
    title: Git repository source
  v1HealthCheckResponse:
    type: object
    properties:
      status:
        $ref: '#/definitions/HealthCheckResponseServingStatus'
  v1ListSupportedVersionsResponse:
    type: object
    properties:
      rustc_versions:
        type: array
        items:
          type: string
        title: |-
          Supported Rust compiler versions
          e.g., ["1.75.0", "1.76.0", "1.77.0"]
      sdk_versions:
        type: array
        items:
          type: string
        title: |-
          Supported Fluentbase SDK versions
          e.g., ["0.5.0", "0.5.1", "0.6.0"]
      default_rustc_version:
        type: string
        title: Default versions (used if service cannot determine from source)
      default_sdk_version:
        type: string
    title: Response with supported versions
  v1VerificationMetadata:
    type: object
    properties:
      deployed_bytecode_hash:
        type: string
        title: Bytecode hash of deployed contract
      compiled_bytecode_hash:
        type: string
        title: Bytecode hash from compilation
      compiler_version_full:
        type: string
        title: |-
          Full compiler version string actually used
          e.g., "rustc 1.75.0 (82e1608df 2023-12-21)"
      sdk_version_used:
        type: string
        title: SDK version actually used
      verified_at:
        type: string
        format: uint64
        title: Verification timestamp (Unix seconds)
    title: Additional verification metadata
  v1VerificationResult:
    type: object
    properties:
      contract_address:
        type: string
        title: Contract address (echoed from request)
      chain_id:
        type: string
        title: Chain ID (echoed from request)
      abi_json:
        type: string
        title: Contract ABI as JSON string
      compile_settings_used:
        $ref: '#/definitions/v1CompileSettings'
        title: Compilation settings that were actually used
      source_files:
        type: object
        additionalProperties:
          type: string
        title: |-
          Source files that were compiled
          Map: relative path -> content
      metadata:
        $ref: '#/definitions/v1VerificationMetadata'
        title: Additional metadata
    title: Successful verification result
  v1VerificationStatus:
    type: string
    enum:
      - STATUS_UNSPECIFIED
      - STATUS_SUCCESS
      - STATUS_BYTECODE_MISMATCH
      - STATUS_COMPILATION_FAILED
      - STATUS_INVALID_SOURCE
      - STATUS_NETWORK_ERROR
      - STATUS_UNSUPPORTED_VERSION
      - STATUS_ERROR
    default: STATUS_UNSPECIFIED
    description: |-
      - STATUS_UNSPECIFIED: Default value
       - STATUS_SUCCESS: Verification successful - bytecode matches
       - STATUS_BYTECODE_MISMATCH: Verification failed - bytecode mismatch
       - STATUS_COMPILATION_FAILED: Compilation failed
       - STATUS_INVALID_SOURCE: Invalid source or configuration
       - STATUS_NETWORK_ERROR: Network or RPC error
       - STATUS_UNSUPPORTED_VERSION: Unsupported compiler or SDK version
       - STATUS_ERROR: Other error (see error_message)
    title: Verification status enum
  v1VerifyWasmRequest:
    type: object
    properties:
      archive_source:
        $ref: '#/definitions/v1ArchiveSource'
      git_source:
        $ref: '#/definitions/v1GitSource'
      contract_address:
        type: string
        title: Contract address on blockchain
      chain_id:
        type: string
        title: Chain ID where contract is deployed
      rpc_endpoint:
        type: string
        title: RPC endpoint to fetch bytecode
      compile_settings:
        $ref: '#/definitions/v1CompileSettings'
        title: Compilation settings (required)
    title: Request message for contract verification
  v1VerifyWasmResponse:
    type: object
    properties:
      status:
        $ref: '#/definitions/v1VerificationStatus'
        title: Verification status
      contract_name:
        type: string
        title: Contract name from Cargo.toml
      error_message:
        type: string
        title: Error message if verification failed
      result:
        $ref: '#/definitions/v1VerificationResult'
        title: Verification result (only if successful)
    title: Response message for verification
