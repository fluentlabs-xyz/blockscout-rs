swagger: "2.0"
info:
  title: v1/fluent-verifier.proto
  version: version not set
tags:
  - name: WasmVerifier
  - name: Health
consumes:
  - application/json
produces:
  - application/json
paths:
  /api/v1/fluent/available-versions:
    get:
      summary: Lists available SDK versions (Docker image tags)
      operationId: WasmVerifier_ListAvailableVersions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAvailableVersionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: include_prerelease
          description: 'Optional: include pre-release versions'
          in: query
          required: false
          type: boolean
      tags:
        - WasmVerifier
  /api/v1/fluent/verify-wasm:
    post:
      summary: Verifies a WASM contract using fluentbase CLI
      operationId: WasmVerifier_VerifyWasm
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1VerifyWasmResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1VerifyWasmRequest'
      tags:
        - WasmVerifier
  /health:
    get:
      summary: |-
        If the requested service is unknown, the call will fail with status
        NOT_FOUND.
      operationId: Health_Check
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1HealthCheckResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: service
          in: query
          required: false
          type: string
      tags:
        - Health
definitions:
  HealthCheckResponseServingStatus:
    type: string
    enum:
      - UNKNOWN
      - SERVING
      - NOT_SERVING
      - SERVICE_UNKNOWN
    default: UNKNOWN
    description: ' - SERVICE_UNKNOWN: Used only by the Watch method.'
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1ArchiveSource:
    type: object
    properties:
      content:
        type: string
        format: byte
        title: Archive content as bytes
      project_path:
        type: string
        title: |-
          Path to project directory within archive (e.g., "." or "contracts/my-contract")
          If empty, assumes project is at archive root
    title: Archive source (tar.gz or zip)
  v1CompileSettings:
    type: object
    properties:
      sdk_version:
        type: string
        title: |-
          SDK version (Docker image tag) - REQUIRED
          This determines which pre-built Docker image to use
          Examples: "v0.2.1-dev", "v0.3.0", "latest"
      features:
        type: array
        items:
          type: string
        title: |-
          Cargo features to enable
          Example: ["mainnet", "testnet"]
      no_default_features:
        type: boolean
        title: Disable default features
    title: Simplified compilation settings
  v1GitSource:
    type: object
    properties:
      repository_url:
        type: string
        title: |-
          Public repository URL (must be HTTPS)
          e.g., "https://github.com/user/project.git"
      commit_ref:
        type: string
        title: |-
          Commit hash, tag, or branch to checkout
          e.g., "main", "v1.0.0", "abc123def456"
      project_path:
        type: string
        title: |-
          Path to project directory within repository
          If empty, assumes project is at repository root
    title: Git repository source
  v1HealthCheckResponse:
    type: object
    properties:
      status:
        $ref: '#/definitions/HealthCheckResponseServingStatus'
  v1ListAvailableVersionsResponse:
    type: object
    properties:
      sdk_versions:
        type: array
        items:
          type: string
        title: |-
          Available SDK versions (Docker image tags)
          e.g., ["v0.2.1-dev", "v0.3.0", "v0.3.1", "latest"]
      latest_stable:
        type: string
        title: Recommended/latest stable version
    title: Response with available SDK versions
  v1VerificationResult:
    type: object
    properties:
      contract_address:
        type: string
        title: Context (echoed from request for debugging/logging)
      chain_id:
        type: string
      expected_hash:
        type: string
        description: Hash from blockchain
        title: Hash comparison results
      actual_hash:
        type: string
        title: Hash from compilation
      compile_settings:
        $ref: '#/definitions/v1CompileSettings'
        title: Compilation settings used (for reproducibility)
      rustc_version:
        type: string
        description: e.g., "rustc 1.87.0 (17067e9ac 2025-05-09)"
        title: Compilation environment info
      sdk_version:
        type: string
        title: 'Full version: "0.1.0-1c0a988d0e5a0ce3015084d53ffa85d5450c3eac"'
      build_platform:
        type: string
        title: e.g., "docker:linux-x86_64"
      source_files:
        type: object
        additionalProperties:
          type: string
        title: |-
          Source files that were compiled
          Map: relative path -> content
    title: Successful verification result
  v1VerificationStatus:
    type: string
    enum:
      - STATUS_UNSPECIFIED
      - STATUS_SUCCESS
      - STATUS_BYTECODE_MISMATCH
      - STATUS_COMPILATION_FAILED
      - STATUS_INVALID_SOURCE
      - STATUS_NETWORK_ERROR
      - STATUS_INVALID_SDK_VERSION
      - STATUS_ERROR
    default: STATUS_UNSPECIFIED
    description: |-
      - STATUS_UNSPECIFIED: Default value
       - STATUS_SUCCESS: Verification successful - bytecode matches
       - STATUS_BYTECODE_MISMATCH: Verification failed - bytecode mismatch
       - STATUS_COMPILATION_FAILED: Compilation failed
       - STATUS_INVALID_SOURCE: Invalid source or configuration
       - STATUS_NETWORK_ERROR: Network or RPC error
       - STATUS_INVALID_SDK_VERSION: SDK version not found (Docker image doesn't exist)
       - STATUS_ERROR: Other error (see error_message)
    title: Verification status enum
  v1VerifyWasmRequest:
    type: object
    properties:
      archive_source:
        $ref: '#/definitions/v1ArchiveSource'
      git_source:
        $ref: '#/definitions/v1GitSource'
      contract_address:
        type: string
        title: Contract address on blockchain
      chain_id:
        type: string
        title: Chain ID where contract is deployed
      rpc_endpoint:
        type: string
        title: RPC endpoint to fetch bytecode
      compile_settings:
        $ref: '#/definitions/v1CompileSettings'
        title: Compilation settings (required)
    title: Request message for contract verification
  v1VerifyWasmResponse:
    type: object
    properties:
      status:
        $ref: '#/definitions/v1VerificationStatus'
        title: Verification status
      error_message:
        type: string
        title: Error message if verification failed
      result:
        $ref: '#/definitions/v1VerificationResult'
        title: Verification result (only if successful)
    title: Response message for verification
