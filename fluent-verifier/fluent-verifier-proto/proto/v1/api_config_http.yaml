type: google.api.Service
config_version: 3

http:
  rules:
    # Rules for WasmVerifier service
    - selector: blockscout.fluentVerifier.v1.WasmVerifier.VerifyWasm
      post: /api/v1/fluent/verify-wasm # HTTP POST endpoint for wasm verification
      body: "*" # Indicates that the entire request body is mapped to the gRPC request message

    - selector: blockscout.fluentVerifier.v1.WasmVerifier.ListSupportedVersions
      get: /api/v1/fluent/supported-versions # HTTP GET endpoint for supported versions

    # Rules for Health service
    - selector: blockscout.fluentVerifier.v1.Health.Check
      get: /health 