syntax = "proto3";

package blockscout.fluentVerifier.v1;

option go_package = "github.com/blockscout/blockscout-rs/fluent-verifier";

// Service definition for verifying Fluent WASM smart contracts.
service WasmVerifier {
  // Verifies a WASM contract using fluent-compiler CLI
  rpc VerifyWasm(VerifyWasmRequest) returns (VerifyWasmResponse);
  
  // Lists supported compiler and SDK versions
  rpc ListSupportedVersions(ListSupportedVersionsRequest) returns (ListSupportedVersionsResponse);
}

// Request message for contract verification
message VerifyWasmRequest {
  // Source code - either archive or git repository
  oneof source {
    ArchiveSource archive_source = 1;
    GitSource git_source = 2;
  }
  
  // Contract address on blockchain
  string contract_address = 3;
  
  // Chain ID where contract is deployed
  string chain_id = 4;
  
  // RPC endpoint to fetch bytecode
  string rpc_endpoint = 5;
  
  // Compilation settings (required)
  CompileSettings compile_settings = 6;
}

// Archive source (tar.gz or zip)
message ArchiveSource {
  // Archive content as bytes
  bytes content = 1;
  
  // Path to project directory within archive (e.g., "." or "contracts/my-contract")
  // If empty, assumes project is at archive root
  string project_path = 2;
}

// Git repository source
message GitSource {
  // Public repository URL (must be HTTPS)
  // e.g., "https://github.com/user/project.git"
  string repository_url = 1;
  
  // Commit hash, tag, or branch to checkout
  // e.g., "main", "v1.0.0", "abc123def456"
  string commit_ref = 2;
  
  // Path to project directory within repository
  // If empty, assumes project is at repository root
  string project_path = 3;
}

// Compilation settings (all fields required)
message CompileSettings {
  // Rust compiler version (required)
  // e.g., "1.75.0" or "rustc 1.75.0 (82e1608df 2023-12-21)"
  // The service will parse and match the version
  string rustc_version = 1;
  
  // Fluentbase SDK version (required)
  // Must be a semantic version, e.g., "0.5.0"
  string sdk_version = 2;
  
  // Build profile: "release", "debug", or custom
  // If empty, defaults to "release"
  string profile = 3;
  
  // Cargo features to enable
  // Empty list means no additional features
  repeated string features = 4;
  
  // Disable default features
  bool no_default_features = 5;
}

// Response message for verification
message VerifyWasmResponse {
  // Verification status
  VerificationStatus status = 1;
  
  // Contract name from Cargo.toml
  string contract_name = 2;
  
  // Error message if verification failed
  string error_message = 3;
  
  // Verification result (only if successful)
  VerificationResult result = 4;
}

// Verification status enum
enum VerificationStatus {
  // Default value
  STATUS_UNSPECIFIED = 0;
  
  // Verification successful - bytecode matches
  STATUS_SUCCESS = 1;
  
  // Verification failed - bytecode mismatch
  STATUS_BYTECODE_MISMATCH = 2;
  
  // Compilation failed
  STATUS_COMPILATION_FAILED = 3;
  
  // Invalid source or configuration
  STATUS_INVALID_SOURCE = 4;
  
  // Network or RPC error
  STATUS_NETWORK_ERROR = 5;
  
  // Unsupported compiler or SDK version
  STATUS_UNSUPPORTED_VERSION = 6;
  
  // Other error (see error_message)
  STATUS_ERROR = 7;
}

// Successful verification result
message VerificationResult {
  // Contract address (echoed from request)
  string contract_address = 1;
  
  // Chain ID (echoed from request)
  string chain_id = 2;
  
  // Contract ABI as JSON string
  string abi_json = 3;
  
  // Compilation settings that were actually used
  CompileSettings compile_settings_used = 4;
  
  // Source files that were compiled
  // Map: relative path -> content
  map<string, string> source_files = 5;
  
  // Additional metadata
  VerificationMetadata metadata = 6;
}

// Additional verification metadata
message VerificationMetadata {
  // Bytecode hash of deployed contract
  string deployed_bytecode_hash = 1;
  
  // Bytecode hash from compilation
  string compiled_bytecode_hash = 2;
  
  // Full compiler version string actually used
  // e.g., "rustc 1.75.0 (82e1608df 2023-12-21)"
  string compiler_version_full = 3;
  
  // SDK version actually used  
  string sdk_version_used = 4;
  
  // Verification timestamp (Unix seconds)
  uint64 verified_at = 5;
}

// Request for supported versions
message ListSupportedVersionsRequest {}

// Response with supported versions
message ListSupportedVersionsResponse {
  // Supported Rust compiler versions
  // e.g., ["1.75.0", "1.76.0", "1.77.0"]
  repeated string rustc_versions = 1;
  
  // Supported Fluentbase SDK versions
  // e.g., ["0.5.0", "0.5.1", "0.6.0"]
  repeated string sdk_versions = 2;
  
  // Default versions (used if service cannot determine from source)
  string default_rustc_version = 3;
  string default_sdk_version = 4;
}